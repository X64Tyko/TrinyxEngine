name: Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Only one docs deployment runs at a time; newer push cancels older.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    name: Generate Doxygen
    # GitHub Pages isn't available for private repos on the free plan.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history gives Doxygen accurate file dates.
          fetch-depth: 0
          submodules: recursive

      - name: Install Doxygen + Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Install m.css dependencies
        run: pip install jinja2 Pygments

      - name: Run Doxygen (XML)
        run: doxygen Doxyfile

      - name: Run m.css
        run: python vendor/mcss/documentation/doxygen.py conf.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Doxyfile sets OUTPUT_DIRECTORY = docs/doxygen, HTML_OUTPUT = html
          path: docs/doxygen/html

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
