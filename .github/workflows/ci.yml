name: CI

on:
  push:
    branches: [ main, Dev-Main ]
    # CI tags — run CI on demand from a push (for copies where plain pushes skip CI):
    #   ci-linux-<anything>    Linux jobs only (cheapest)
    #   ci-windows-<anything>  Windows jobs only (Windows minutes count double)
    #   ci-all-<anything>      both platforms
    #   ci-<anything else>     Linux only
    # e.g.  git tag ci-linux-$(git rev-parse --short HEAD) && git push origin ci-linux-$(git rev-parse --short HEAD)
    tags: [ 'ci-*' ]
  pull_request:
    branches: [ main, Dev-Main ]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build"
        type: choice
        options: [ linux, windows, all ]
        default: linux

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Matrix: 2 platforms × 8 build configurations = 16 jobs
#
# Each config tests a distinct feature combination:
#   minimal                  — baseline, no optional systems
#   rollback                 — temporal ring buffer + Jolt deterministic mode
#   network-client           — GNS client stack, BCrypt/OpenSSL backend
#   network-client-rollback  — GNS client + rollback (full competitive client)
#   network-server           — dedicated server model (forces TNX_HEADLESS)
#   network-server-rollback  — dedicated server + rollback
#   align64                  — 64-byte field array alignment (different memory layout)
#   tracy                    — Tracy profiler compiled in (level 1, minimal overhead)
#
# Editor is excluded — mutually exclusive with TNX_HEADLESS.
# PIE net model is excluded — requires editor.
# AVX2 is enabled — GitHub hosted runners (ubuntu-24.04, windows-latest) support it.
# USE_AVX2=OFF prevents Jolt from propagating PUBLIC /arch:AVX2 flags to consumers;
# ENABLE_AVX2=ON adds it directly, which already covers all targets.
# ---------------------------------------------------------------------------

jobs:
  # ---------------------------------------------------------------------------
  # Plan — decides whether CI runs and on which platforms.
  # Public repositories: every push/PR, both platforms.
  # Private forks (metered Actions minutes): only manual runs and ci-* tags; plain
  # branch pushes skip everything. Run scripts/presubmit.py locally instead.
  # ---------------------------------------------------------------------------
  plan:
    name: Plan
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/ci-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      os: ${{ steps.pick.outputs.os }}
      linux: ${{ steps.pick.outputs.linux }}
    steps:
      - id: pick
        env:
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          REF: ${{ github.ref }}
        run: |
          platforms="$INPUT_PLATFORMS"
          if [ -z "$platforms" ]; then
            case "$REF" in
              refs/tags/ci-windows*) platforms=windows ;;
              refs/tags/ci-all*)     platforms=all ;;
              refs/tags/ci-*)        platforms=linux ;;
              *)                     platforms=all ;;
            esac
          fi
          case "$platforms" in
            linux)   os='["ubuntu-24.04"]' ;;
            windows) os='["windows-latest"]' ;;
            *)       os='["ubuntu-24.04", "windows-latest"]' ;;
          esac
          echo "Platforms: $platforms"
          echo "os=$os" >> "$GITHUB_OUTPUT"
          echo "linux=$([ "$platforms" = windows ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: "${{ matrix.os == 'windows-latest' && 'Windows' || 'Linux' }} | ${{ matrix.config }}"
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
        config: [ minimal, rollback, network-client, network-client-rollback, network-server, network-server-rollback, align64, tracy ]

        # No per-OS include entries: with a single-OS matrix they would be added as extra,
        # config-less jobs. The display name is derived from matrix.os instead.
        include:
          # --- Per-config cmake flags and metadata ---
          - config: minimal
            cmake_extra: >-
              -DTNX_ENABLE_ROLLBACK=OFF
              -DTNX_ENABLE_NETWORK=OFF
              -DENABLE_TRACY=OFF
              -DTNX_ALIGN_64=OFF
            needs_openssl: false

          - config: rollback
            cmake_extra: >-
              -DTNX_ENABLE_ROLLBACK=ON
              -DTNX_ENABLE_NETWORK=OFF
              -DENABLE_TRACY=OFF
              -DTNX_ALIGN_64=OFF
            needs_openssl: false

          - config: network-client
            cmake_extra: >-
              -DTNX_ENABLE_ROLLBACK=OFF
              -DTNX_ENABLE_NETWORK=ON
              -DTNX_NET_MODEL=Client
              -DENABLE_TRACY=OFF
              -DTNX_ALIGN_64=OFF
            needs_openssl: true

          - config: network-client-rollback
            cmake_extra: >-
              -DTNX_ENABLE_ROLLBACK=ON
              -DTNX_ENABLE_NETWORK=ON
              -DTNX_NET_MODEL=Client
              -DENABLE_TRACY=OFF
              -DTNX_ALIGN_64=OFF
            needs_openssl: true

          - config: network-server
            cmake_extra: >-
              -DTNX_ENABLE_ROLLBACK=OFF
              -DTNX_ENABLE_NETWORK=ON
              -DTNX_NET_MODEL=Server
              -DENABLE_TRACY=OFF
              -DTNX_ALIGN_64=OFF
            needs_openssl: true

          - config: network-server-rollback
            cmake_extra: >-
              -DTNX_ENABLE_ROLLBACK=ON
              -DTNX_ENABLE_NETWORK=ON
              -DTNX_NET_MODEL=Server
              -DENABLE_TRACY=OFF
              -DTNX_ALIGN_64=OFF
            needs_openssl: true

          - config: align64
            cmake_extra: >-
              -DTNX_ENABLE_ROLLBACK=OFF
              -DTNX_ENABLE_NETWORK=OFF
              -DENABLE_TRACY=OFF
              -DTNX_ALIGN_64=ON
            needs_openssl: false

          - config: tracy
            cmake_extra: >-
              -DTNX_ENABLE_ROLLBACK=OFF
              -DTNX_ENABLE_NETWORK=OFF
              -DENABLE_TRACY=ON
              -DTRACY_PROFILE_LEVEL=1
              -DTNX_ALIGN_64=OFF
            needs_openssl: false

    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # -----------------------------------------------------------------------
      # Linux dependencies
      # libs/SDL3 contains Windows binaries; Linux builds SDL3 from source (libs/SDL3-src).
      # OpenSSL is only needed for network configs on Linux; Windows uses BCrypt.
      # -----------------------------------------------------------------------
      - name: Install Linux base dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ ccache

      - name: Install Linux OpenSSL (network configs)
        if: matrix.os == 'ubuntu-24.04' && matrix.needs_openssl == true
        run: sudo apt-get install -y libssl-dev

      # -----------------------------------------------------------------------
      # Windows: Ninja inside the MSVC developer environment, so the build uses
      # whichever Visual Studio the runner image ships instead of pinning a
      # version (windows-latest dropped VS 2022). Ninja also honours the sccache
      # compiler launcher, which the Visual Studio generator ignores.
      # BCrypt (Windows SDK) replaces OpenSSL for GNS — no extra install needed.
      # -----------------------------------------------------------------------
      - name: Install sccache (Windows)
        if: matrix.os == 'windows-latest'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install Ninja (Windows)
        if: matrix.os == 'windows-latest'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: MSVC developer environment (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # -----------------------------------------------------------------------
      # Build caching — ccache (Linux) / sccache (Windows)
      # Cache key: OS + config + compiler version + all CMakeLists hashes.
      # Invalidates if any cmake file changes, restores otherwise.
      # -----------------------------------------------------------------------
      - name: Cache ccache (Linux)
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.os }}-${{ matrix.config }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ccache-${{ matrix.os }}-${{ matrix.config }}-
            ccache-${{ matrix.os }}-

      # -----------------------------------------------------------------------
      # Configure
      # -----------------------------------------------------------------------
      - name: Configure (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          cmake -B cmake-build-ci \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DTNX_HEADLESS=ON \
            -DENABLE_AVX2=ON \
            -DUSE_AVX2=OFF \
            ${{ matrix.cmake_extra }}

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cmake -B cmake-build-ci `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DTNX_HEADLESS=ON `
            -DENABLE_AVX2=ON `
            -DUSE_AVX2=OFF `
            ${{ matrix.cmake_extra }}

      # -----------------------------------------------------------------------
      # Build
      # -----------------------------------------------------------------------
      - name: Build
        run: cmake --build cmake-build-ci --target Testbed --config Release --parallel

      # -----------------------------------------------------------------------
      # Test
      # Testbed's local config keeps a 128-frame temporal ring over 500k entities
      # (~22 GB with rollback). Hosted runners have 16 GB, so CI runs a 32-frame
      # ring — the engine default, and far more than the rollback tests need.
      # -----------------------------------------------------------------------
      - name: Size temporal ring for hosted runners
        shell: bash
        run: sed -i 's/^TemporalFrameCount = .*/TemporalFrameCount = 32/' Testbed/TestbedDefaults.ini

      - name: Test (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: ./cmake-build-ci/bin/Testbed --headless --max-frames 120

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: .\cmake-build-ci\bin\Testbed.exe --headless --max-frames 120

      # -----------------------------------------------------------------------
      # Upload logs on failure — makes remote debugging possible.
      # -----------------------------------------------------------------------
      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-${{ matrix.os }}-${{ matrix.config }}
          path: |
            cmake-build-ci/**/*.log
            cmake-build-ci/CMakeFiles/CMakeOutput.log
            cmake-build-ci/CMakeFiles/CMakeError.log
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Two-process loopback test — Linux only.
  #
  # Builds server and client Testbed binaries separately, then runs them on the
  # same runner. Server listens on 127.0.0.1:27020; client connects, exchanges
  # Ping/Pong, disconnects. Both processes must exit 0.
  #
  # ccache is shared between both builds — the second build reuses all objects
  # whose compilation is identical (common engine, Jolt, GNS); only files that
  # differ due to TNX_NET_MODEL_* preprocessor flags are recompiled.
  # ---------------------------------------------------------------------------
  network-loopback:
    name: "Linux | network-loopback (two-process)"
    needs: plan
    if: ${{ needs.plan.outputs.linux == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ ccache libssl-dev

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-loopback-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ccache-loopback-
            ccache-ubuntu-24.04-network-server-

      # --- Build server binary ---
      - name: Configure (server)
        run: |
          cmake -B cmake-build-ci-server \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DTNX_HEADLESS=ON \
            -DENABLE_AVX2=ON \
            -DUSE_AVX2=OFF \
            -DTNX_ENABLE_ROLLBACK=OFF \
            -DTNX_ENABLE_NETWORK=ON \
            -DTNX_NET_MODEL=Server \
            -DENABLE_TRACY=OFF \
            -DTNX_ALIGN_64=OFF

      - name: Build (server)
        run: cmake --build cmake-build-ci-server --target Testbed --config Release --parallel

      # --- Build client binary ---
      - name: Configure (client)
        run: |
          cmake -B cmake-build-ci-client \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DTNX_HEADLESS=ON \
            -DENABLE_AVX2=ON \
            -DUSE_AVX2=OFF \
            -DTNX_ENABLE_ROLLBACK=OFF \
            -DTNX_ENABLE_NETWORK=ON \
            -DTNX_NET_MODEL=Client \
            -DENABLE_TRACY=OFF \
            -DTNX_ALIGN_64=OFF

      - name: Build (client)
        run: cmake --build cmake-build-ci-client --target Testbed --config Release --parallel

      # --- Run two-process loopback ---
      - name: Run loopback test
        run: |
          # Start server in background — blocks in PostInitialize waiting for client
          TNX_LOOPBACK_SERVER=1 ./cmake-build-ci-server/bin/Testbed \
            --headless --max-frames 2 --test Net_Loopback_Server &
          SERVER_PID=$!

          # Give the server process time to bind the socket before client connects
          sleep 1

          # Run client — blocks in PostInitialize until Ping/Pong exchange completes
          TNX_LOOPBACK_CLIENT=1 ./cmake-build-ci-client/bin/Testbed \
            --headless --max-frames 2 --test Net_Loopback_Client
          CLIENT_EXIT=$?

          # Wait for server to finish (it detects client disconnect and exits cleanly)
          wait $SERVER_PID
          SERVER_EXIT=$?

          echo "Client exit: $CLIENT_EXIT  Server exit: $SERVER_EXIT"
          [ $CLIENT_EXIT -eq 0 ] && [ $SERVER_EXIT -eq 0 ]

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-loopback
          path: |
            cmake-build-ci-server/**/*.log
            cmake-build-ci-client/**/*.log
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Fast-forward main to match Dev-Main once all CI jobs pass.
  # Runs only on push to Dev-Main (not on PRs, not on main pushes).
  # Uses the exact SHA that passed CI — not the branch tip — so a race-condition
  # push that lands between CI start and merge cannot slip through.
  # If main has diverged (requires rebase), the push fails explicitly.
  # ---------------------------------------------------------------------------
  merge-to-main:
    name: "Fast-forward main ← Dev-Main"
    needs: [ build-and-test, network-loopback ]
    if: github.ref == 'refs/heads/Dev-Main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to main
        run: |
          git fetch origin main

          # Case 1: main already contains our SHA (a newer CI run beat us here).
          # This is not an error — the more recent commit is already on main.
          if git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "main is already at or ahead of ${{ github.sha }} — nothing to do."
            exit 0
          fi

          # Case 2: our SHA is ahead of main (clean fast-forward) — push normally.
          if git merge-base --is-ancestor origin/main "${{ github.sha }}"; then
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git \
              ${{ github.sha }}:refs/heads/main
            exit 0
          fi

          # Case 3: true divergence — someone committed directly to main.
          echo "ERROR: main has diverged from Dev-Main. Rebase Dev-Main onto main before merging."
          exit 1
